# ========================================================
# Nginx 配置：/etc/nginx/sites-available/vote.trythis.pw
# 域名：vote.trythis.pw
# 证书：/etc/nginx/ssl/trythis.pw.pem
# 后端：Docker 容器 127.0.0.1:8090
# ========================================================

# 1. HTTP 强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vote.trythis.pw;
    return 301 https://$host$request_uri;
}

# 2. HTTPS 主服务 (支持 HTTP/2 + Cloudflare 真实 IP + 视频流式分段)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vote.trythis.pw;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/trythis.pw.pem;
    ssl_certificate_key /etc/nginx/ssl/trythis.pw.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 上传文件体积限制 (支持 100MB 参赛视频上传)
    client_max_body_size 120M;

    # 所有前端 SPA 页面与后端 API 统一交由本地 Docker 容器托管
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # 核心：精准透传 Cloudflare 客户端真实 IP (防刷防作弊判定依据)
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 媒体与视频 HTTP 206 Partial Content 分段秒播支持
        proxy_cache_bypass $http_range;
        proxy_no_cache $http_range;

        # SSE (Server-Sent Events) 实时大屏推送防缓冲与长连接超时保护
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
