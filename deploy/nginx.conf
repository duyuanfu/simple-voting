# 推荐放置在宿主机 Nginx 的 conf.d/voting.conf 中
# 适用于：4C4G 服务器（存在其他服务，通过独立域名分流） + Cloudflare 代理
server {
    listen 80;
    server_name vote.yourdomain.com; # 替换为您在 Cloudflare 解析的域名

    # Cloudflare HTTPS 自动适配（Cloudflare 端开启 Always Use HTTPS）
    # 如果宿主机也配置了 SSL，可监听 443 ssl http2

    client_max_body_size 120M; # 允许最大 100MB+ 视频上传

    # 1. 前端 React 静态页面分发
    location / {
        root /var/www/simple-voting/frontend/dist; # 宿主机前端编译构建目录
        index index.html;
        try_files $uri $uri/ /index.html; # 支持 React Router SPA 路由

        # 静态资源长期缓存（配合 Cloudflare CDN）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8001; # 后端 FastAPI 服务地址
        proxy_http_version 1.1;

        # 核心：精准透传 Cloudflare 客户端真实 IP
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 HTTP 206 Range 视频分片流式播放
        proxy_cache_bypass $http_range;
        proxy_no_cache $http_range;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # 3. 针对 SSE (Server-Sent Events) 实时大屏的长连接优化
    location /api/v1/analytics/campaigns/.*/stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # 关闭 Nginx 缓冲，让事件实时推送到前端
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 长连接超时保护（防止每 60 秒被 Nginx 掐断）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
