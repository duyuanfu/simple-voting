# ========================================================
# 宿主机 Nginx 配置文件 (放置于 /etc/nginx/conf.d/voting.conf)
# 架构：4C4G 服务器 (已有其他业务服务) + Cloudflare 代理 + Docker (127.0.0.1:8090)
# ========================================================

server {
    listen 80;
    server_name vote.yourdomain.com; # 替换为您在 Cloudflare 解析的域名

    client_max_body_size 120M; # 允许最大 100MB 参赛视频上传

    # 所有前端页面、静态资源与后端 API 统一交由 Docker 容器处理
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # 核心：精准透传 Cloudflare 客户端真实 IP (防刷核心依据)
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 HTTP 206 Range 视频分片流式秒播
        proxy_cache_bypass $http_range;
        proxy_no_cache $http_range;

        # 针对 SSE 实时监控大屏的长连接防断开优化
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
